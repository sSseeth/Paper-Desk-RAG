name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # No Secret Service on the runner. The null backend returns immediately
      # and stores nothing. Tests stay offline: they receive no credentials
      # and conftest blocks socket connections.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest
